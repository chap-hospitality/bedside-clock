<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="นาฬิกา">
<title>นาฬิกาหัวเตียง</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; color: #5aa9ff; overflow: hidden;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-user-select: none; -webkit-tap-highlight-color: rgba(0,0,0,0);
    -webkit-text-size-adjust: 100%;
  }
  #bg {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background-size: cover; background-position: center;
    opacity: 0; -webkit-transition: opacity 1.5s; transition: opacity 1.5s;
  }
  #bg.on { opacity: 1; }
  #shade { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 4, 20, 0.6); }

  #stage {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center;
    -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center;
    -webkit-transition: -webkit-transform 4s ease-in-out; transition: transform 4s ease-in-out;
  }

  /* ---- Left: clock ---- */
  #left {
    -webkit-box-flex: 1.25; -webkit-flex: 1.25; flex: 1.25;
    text-align: center;
  }
  #time {
    font-weight: 200; line-height: 0.84; letter-spacing: -0.03em;
    font-size: 44vmin; color: #5aa9ff; white-space: nowrap;
    text-shadow: 0 0 0.08em rgba(60, 120, 255, 0.35);
  }
  #time div { position: relative; }
  #sec { position: absolute; font-size: 0.16em; font-weight: 300; letter-spacing: 0;
         right: -0.9em; bottom: 0.35em; color: #3f6fd8; }
  #date { font-size: 5vmin; font-weight: 300; color: #8fb8ff; margin-top: 2.4vmin; }

  /* ---- Right: info ---- */
  #right {
    -webkit-box-flex: 1; -webkit-flex: 1; flex: 1;
    border-left: 1px solid rgba(90, 140, 255, 0.22);
    padding: 0 3.5vw 0 3.5vw; color: #8fb8ff; font-weight: 300;
    font-size: 2.7vw; line-height: 1.3;
  }
  .block { padding: 1.4vw 0; border-bottom: 1px solid rgba(90, 140, 255, 0.12); }
  .block:last-child { border-bottom: 0; }
  .lbl { font-size: 0.78em; color: #5f80c8; }

  #wNow { display: -webkit-box; display: -webkit-flex; display: flex;
          -webkit-box-align: center; -webkit-align-items: center; align-items: center; }
  #wIcon { font-size: 2.1em; margin-right: 0.3em; }
  #wTemp { font-size: 2.3em; color: #5aa9ff; margin-right: 0.35em; font-weight: 200; }
  #wDesc { line-height: 1.25; }

  #aq { display: -webkit-box; display: -webkit-flex; display: flex;
        -webkit-box-align: center; -webkit-align-items: center; align-items: center; }
  #aqDot { width: 0.75em; height: 0.75em; border-radius: 50%; background: #444; margin-right: 0.45em; }
  #aqVal { font-size: 1.7em; color: #5aa9ff; margin-right: 0.3em; font-weight: 300; }
  #aqUnit { font-size: 0.72em; color: #5f80c8; margin-right: 0.5em; }
  #aqTxt { font-size: 0.95em; }

  #hours { display: -webkit-box; display: -webkit-flex; display: flex; text-align: center; }
  .h { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; }
  .h .t { font-size: 0.78em; color: #5f80c8; }
  .h .i { font-size: 1.2em; }
  .h .r { font-size: 0.72em; color: #4f74c4; }

  #sun { font-size: 0.92em; }

  /* ---- Portrait: stack ---- */
  @media (orientation: portrait) {
    #stage { -webkit-box-orient: vertical; -webkit-flex-direction: column; flex-direction: column; }
    #left, #right { -webkit-box-flex: 0; -webkit-flex: none; flex: none; }
    #time { font-size: 46vmin; }
    #date { font-size: 5vw; }
    #right { border-left: 0; border-top: 1px solid rgba(90, 140, 255, 0.22);
             margin-top: 5vw; padding: 1vw 7vw 0; font-size: 4.4vw; width: 86vw; }
    .block { padding: 2.4vw 0; }
  }

  /* ---- Night mode: white text, dimmed ---- */
  body.night #time { color: #f2f4f8; text-shadow: none; }
  body.night #sec { color: #9aa3b5; }
  body.night #date, body.night #right, body.night #wTemp, body.night #aqVal { color: #d5dae4; }
  body.night .lbl, body.night .h .t, body.night .h .r, body.night #aqUnit { color: #8c94a6; }
  body.night #right { border-color: rgba(255, 255, 255, 0.12); }
  body.night .block { border-color: rgba(255, 255, 255, 0.07); }
  body.night #aqDot { opacity: 0.6; }
  body.night #gear { color: rgba(255,255,255,0.15); }
  body.night #shade { background: rgba(0, 0, 0, 0.85); }
  #dimmer { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #000;
            opacity: 0; pointer-events: none; -webkit-transition: opacity 2s; transition: opacity 2s; }
  body.night #dimmer { opacity: 0.3; }

  /* ---- Settings ---- */
  #gear { position: fixed; right: 0; bottom: 0; width: 60px; height: 60px;
          font-size: 22px; line-height: 60px; text-align: center; color: rgba(120,160,255,0.22); }
  #panel {
    display: none; position: fixed; left: 5%; right: 5%; top: 6%; bottom: 6%;
    background: rgba(8, 14, 40, 0.96); border: 1px solid #22336e; border-radius: 14px;
    color: #b9cdff; padding: 16px 18px; overflow-y: auto; -webkit-overflow-scrolling: touch;
    font-size: 15px; z-index: 10;
  }
  #panel.open { display: block; }
  #panel h2 { margin: 0 0 10px; font-size: 18px; font-weight: 500; color: #8fb8ff; }
  #panel .row { margin: 12px 0; }
  #panel button, #panel label.btn {
    display: inline-block; background: #1b2b66; color: #d6e2ff; border: 0; border-radius: 8px;
    padding: 9px 14px; font-size: 15px; margin: 3px 6px 3px 0; font-family: inherit;
  }
  #panel input[type=file] { position: absolute; left: -9999px; }
  #panel .note { color: #6f86c4; font-size: 13px; }
  #panel .seg button.active { background: #3d63e0; color: #fff; }
</style>
</head>
<body>
<div id="bg"></div>
<div id="shade"></div>

<div id="stage">
  <div id="left">
    <div id="time"><div id="hh">--</div><div><span id="mm">--</span><span id="sec"></span></div></div>
    <div id="date"></div>
  </div>

  <div id="right">
    <div class="block">
      <div id="wNow"><span id="wIcon"></span><span id="wTemp">--°</span><span id="wDesc"></span></div>
    </div>
    <div class="block">
      <div class="lbl" data-t="pm">ฝุ่น PM2.5</div>
      <div id="aq"><span id="aqDot"></span><span id="aqVal">--</span><span id="aqUnit">µg/m³</span><span id="aqTxt"></span></div>
      <div class="lbl" id="aqSrc"></div>
    </div>
    <div class="block">
      <div id="hours"></div>
    </div>
    <div class="block" id="sun"></div>
  </div>
</div>

<div id="dimmer"></div>
<div id="gear">⚙︎</div>

<div id="panel">
  <h2 data-t="settings">ตั้งค่า</h2>

  <div class="row">
    <div data-t="bgPhotos">รูปพื้นหลัง</div>
    <label class="btn" for="file" data-t="addPhoto">＋ เพิ่มรูปจากเครื่อง</label>
    <input type="file" id="file" accept="image/*" multiple>
    <button id="clearPhotos" data-t="clearPhotos">ลบรูปในเครื่อง</button>
    <div class="note" id="photoCount"></div>
  </div>

  <div class="row seg" id="segPhoto">
    <div data-t="showPhotos">แสดงรูป</div>
    <button data-v="on" data-t="on">เปิด</button><button data-v="off" data-t="off">ปิด</button>
  </div>

  <div class="row seg" id="segSec">
    <div data-t="showSec">แสดงวินาที</div>
    <button data-v="on" data-t="on">เปิด</button><button data-v="off" data-t="off">ปิด</button>
  </div>

  <div class="row seg" id="segNight">
    <div data-t="night">โหมดกลางคืน (หรี่จอ + ตัวอักษรสีขาว)</div>
    <button data-v="auto" data-t="nightAuto">อัตโนมัติ 22:00–06:00</button><button data-v="on" data-t="always">เปิดตลอด</button><button data-v="off" data-t="off">ปิด</button>
  </div>

  <div class="row seg" id="segLang">
    <div>ภาษา / Language</div>
    <button data-v="th">ไทย</button><button data-v="en">English</button>
  </div>

  <div class="row">
    <div><span data-t="loc">ตำแหน่งสภาพอากาศ</span>: <span id="locName"></span></div>
    <button id="useGps" data-t="useGps">ใช้ตำแหน่งปัจจุบัน</button>
    <button id="useBkk" data-t="bkk">กรุงเทพฯ</button>
  </div>

  <div class="row note"><span data-t="updated">อัปเดตล่าสุด</span>: <span id="lastUpd">-</span><br><span data-t="credit"></span></div>
  <button id="closePanel" data-t="close">ปิด</button>
</div>

<script>
(function () {
  'use strict';

  // ---------- Config ----------
  var DEFAULT_LOC = { lat: 13.806, lon: 100.537, name: 'กรุงเทพฯ' };
  var WEATHER_EVERY_MS = 15 * 60 * 1000;
  var PHOTO_EVERY_MS = 60 * 1000;
  var DRIFT_EVERY_MS = 3 * 60 * 1000;
  var MAX_LOCAL_PHOTOS = 12;
  var PHOTO_MAX_EDGE = 1136;

  var DAYS = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
  var MONTHS = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',
                'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];

  function $(id) { return document.getElementById(id); }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  // ---------- Storage (safe) ----------
  function load(key, fallback) {
    try {
      var v = window.localStorage.getItem('bclock.' + key);
      return v === null ? fallback : JSON.parse(v);
    } catch (e) { return fallback; }
  }
  function save(key, val) {
    try { window.localStorage.setItem('bclock.' + key, JSON.stringify(val)); return true; }
    catch (e) { return false; }
  }

  var settings = {
    photo: load('photo', 'on'),
    sec: load('sec', 'off'),
    night: load('night', 'auto'),
    loc: load('loc', DEFAULT_LOC),
    lang: load('lang', 'th')
  };

  // ---------- Language ----------
  var DAYS_EN = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var MONTHS_EN = ['January', 'February', 'March', 'April', 'May', 'June', 'July',
                   'August', 'September', 'October', 'November', 'December'];
  var TXT = {
    th: {
      pm: 'ฝุ่น PM2.5', settings: 'ตั้งค่า', bgPhotos: 'รูปพื้นหลัง', addPhoto: '＋ เพิ่มรูปจากเครื่อง',
      clearPhotos: 'ลบรูปในเครื่อง', showPhotos: 'แสดงรูป', on: 'เปิด', off: 'ปิด',
      showSec: 'แสดงวินาที', night: 'โหมดกลางคืน (หรี่จอ + ตัวอักษรสีขาว)',
      nightAuto: 'อัตโนมัติ 22:00–06:00', always: 'เปิดตลอด', loc: 'ตำแหน่งสภาพอากาศ',
      useGps: 'ใช้ตำแหน่งปัจจุบัน', bkk: 'กรุงเทพฯ', close: 'ปิด', updated: 'อัปเดตล่าสุด',
      credit: 'สภาพอากาศจาก Open-Meteo · PM2.5 จากสถานีวัดของกรมควบคุมมลพิษ (Air4Thai) อัปเดตทุกชั่วโมง ถ้าข้อมูลเก่าเกิน 3 ชม. จะใช้ค่าประมาณจาก Open-Meteo แทน',
      feels: 'รู้สึก', hum: 'ชื้น', uv: 'UV สูงสุด', model: 'ค่าประมาณ (Open-Meteo)',
      here: 'ตำแหน่งปัจจุบัน', finding: 'กำลังหาตำแหน่ง...',
      photosLocal: 'รูปในเครื่อง', photosServer: 'รูปจาก server', photosUnit: 'รูป',
      full: 'พื้นที่เก็บรูปในเครื่องเต็ม เพิ่มได้',
      pmBand: ['ดีมาก', 'ดี', 'ปานกลาง', 'เริ่มมีผลต่อสุขภาพ', 'มีผลต่อสุขภาพ'],
      wx: ['ท้องฟ้าแจ่มใส', 'มีเมฆเล็กน้อย', 'มีเมฆบางส่วน', 'เมฆมาก', 'หมอก', 'ฝนปรอย',
           'ฝนตก', 'ฝนเป็นช่วงๆ', 'พายุฝนฟ้าคะนอง', 'หิมะ']
    },
    en: {
      pm: 'PM2.5', settings: 'Settings', bgPhotos: 'Background photos', addPhoto: '＋ Add photos',
      clearPhotos: 'Remove device photos', showPhotos: 'Show photos', on: 'On', off: 'Off',
      showSec: 'Show seconds', night: 'Night mode (dimmed, white text)',
      nightAuto: 'Auto 22:00–06:00', always: 'Always', loc: 'Weather location',
      useGps: 'Use my location', bkk: 'Bangkok', close: 'Close', updated: 'Last updated',
      credit: 'Weather by Open-Meteo · PM2.5 from Pollution Control Department stations (Air4Thai), hourly. If data is over 3 hours old, an Open-Meteo estimate is shown instead.',
      feels: 'Feels', hum: 'Hum', uv: 'Max UV', model: 'Estimate (Open-Meteo)',
      here: 'Current location', finding: 'Finding location...',
      photosLocal: 'Device photos', photosServer: 'server photos', photosUnit: '',
      full: 'Device photo storage full. Added',
      pmBand: ['Very good', 'Good', 'Moderate', 'Starting to affect health', 'Affects health'],
      wx: ['Clear', 'Mostly clear', 'Partly cloudy', 'Cloudy', 'Fog', 'Drizzle',
           'Rain', 'Showers', 'Thunderstorm', 'Snow']
    }
  };
  function T(k) { return TXT[settings.lang][k]; }

  function applyLang() {
    var els = document.querySelectorAll('[data-t]');
    for (var i = 0; i < els.length; i++) {
      var v = T(els[i].getAttribute('data-t'));
      if (typeof v === 'string') { els[i].textContent = v; }
    }
    document.documentElement.lang = settings.lang;
  }

  // ---------- Clock ----------
  function isNight(d) {
    if (settings.night === 'on') { return true; }
    if (settings.night === 'off') { return false; }
    var h = d.getHours();
    return h >= 22 || h < 6;
  }

  var lastMinute = -1;
  function tick() {
    var d = new Date();
    $('hh').textContent = pad(d.getHours());
    $('mm').textContent = pad(d.getMinutes());
    $('sec').textContent = settings.sec === 'on' ? pad(d.getSeconds()) : '';
    if (d.getMinutes() !== lastMinute) {
      lastMinute = d.getMinutes();
      $('date').textContent = settings.lang === 'en'
        ? DAYS_EN[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS_EN[d.getMonth()] + ' ' + d.getFullYear()
        : 'วัน' + DAYS[d.getDay()] + 'ที่ ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + (d.getFullYear() + 543);
      document.body.className = isNight(d) ? 'night' : '';
    }
    setTimeout(tick, 1000 - d.getMilliseconds() + 5);
  }

  // ---------- Network ----------
  function getJSON(url, ok, fail) {
    var x = new XMLHttpRequest();
    var done = false;
    function f() { if (!done) { done = true; fail(); } }
    x.open('GET', url, true);
    x.timeout = 15000;
    x.onreadystatechange = function () {
      if (x.readyState !== 4 || done) { return; }
      if (x.status >= 200 && x.status < 300) {
        try { var j = JSON.parse(x.responseText); done = true; ok(j); } catch (e) { f(); }
      } else { f(); }
    };
    x.ontimeout = f;
    x.send();
  }

  // ---------- Weather ----------
  function wmo(code, isDay) {
    var x = T('wx');
    if (code === 0) { return [isDay ? '☀️' : '🌙', x[0]]; }
    if (code === 1) { return [isDay ? '🌤' : '🌙', x[1]]; }
    if (code === 2) { return ['⛅️', x[2]]; }
    if (code === 3) { return ['☁️', x[3]]; }
    if (code === 45 || code === 48) { return ['🌫', x[4]]; }
    if (code >= 51 && code <= 57) { return ['🌦', x[5]]; }
    if (code >= 61 && code <= 67) { return ['🌧', x[6]]; }
    if (code >= 80 && code <= 82) { return ['🌧', x[7]]; }
    if (code >= 95) { return ['⛈', x[8]]; }
    if (code >= 71 && code <= 86) { return ['❄️', x[9]]; }
    return ['🌡', ''];
  }

  function hhmm(iso) { return iso ? iso.substr(11, 5) : '--:--'; }

  function stamp() {
    var d = new Date();
    $('lastUpd').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  var weatherTimer = null;
  function updateWeather() {
    var L = settings.loc;
    var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + L.lat + '&longitude=' + L.lon +
      '&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,is_day' +
      '&hourly=temperature_2m,weather_code,precipitation_probability,is_day' +
      '&daily=temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max' +
      '&timezone=Asia%2FBangkok&forecast_days=2';
    getJSON(url, function (j) {
      var c = j.current || {}, dly = j.daily || {}, hr = j.hourly || {};
      var w = wmo(c.weather_code, c.is_day === 1);
      $('wIcon').textContent = w[0];
      $('wTemp').textContent = Math.round(c.temperature_2m) + '°';
      var hi = dly.temperature_2m_max ? Math.round(dly.temperature_2m_max[0]) : '-';
      var lo = dly.temperature_2m_min ? Math.round(dly.temperature_2m_min[0]) : '-';
      $('wDesc').innerHTML = w[1] + '<br><span class="lbl">' + T('feels') + ' ' + Math.round(c.apparent_temperature) +
        '° · ' + T('hum') + ' ' + c.relative_humidity_2m + '% · ' + lo + '–' + hi + '°</span>';

      // Next hours: every 3 hours from the coming hour, 4 slots
      var html = '', times = hr.time || [], now = c.time || '';
      var start = 0;
      for (var i = 0; i < times.length; i++) { if (times[i] > now) { start = i; break; } }
      for (var k = 0; k < 4; k++) {
        var idx = start + k * 3;
        if (idx >= times.length) { break; }
        var hw = wmo(hr.weather_code[idx], hr.is_day[idx] === 1);
        var rp = hr.precipitation_probability ? hr.precipitation_probability[idx] : null;
        html += '<div class="h"><div class="t">' + times[idx].substr(11, 5) + '</div>' +
          '<div class="i">' + hw[0] + '</div><div>' + Math.round(hr.temperature_2m[idx]) + '°</div>' +
          '<div class="r">' + (rp !== null && rp > 0 ? '💧' + rp + '%' : '&nbsp;') + '</div></div>';
      }
      $('hours').innerHTML = html;

      var uv = dly.uv_index_max ? Math.round(dly.uv_index_max[0]) : '-';
      $('sun').innerHTML = '🌅 ' + hhmm(dly.sunrise && dly.sunrise[0]) +
        ' &nbsp; 🌇 ' + hhmm(dly.sunset && dly.sunset[0]) + ' &nbsp; <span class="lbl">' + T('uv') + '</span> ' + uv;
      stamp();
    }, function () {
      clearTimeout(weatherTimer);
      weatherTimer = setTimeout(updateWeather, 2 * 60 * 1000);
    });
    updateAir();
    clearTimeout(weatherTimer);
    weatherTimer = setTimeout(updateWeather, WEATHER_EVERY_MS);
  }

  // ---------- PM2.5 (Thai PCD bands, µg/m³) ----------
  function pmBand(v) {
    var x = T('pmBand');
    if (v <= 15)   { return ['#3b9cff', x[0]]; }
    if (v <= 25)   { return ['#3ccf6e', x[1]]; }
    if (v <= 37.5) { return ['#f2d23c', x[2]]; }
    if (v <= 75)   { return ['#ff8a2b', x[3]]; }
    return ['#ff3b3b', x[4]];
  }

  function showPM(v, sub) {
    var b = pmBand(v);
    $('aqVal').textContent = Math.round(v);
    $('aqDot').style.background = b[0];
    $('aqTxt').textContent = b[1];
    $('aqSrc').textContent = sub;
  }

  // Open-Meteo model value: fallback only.
  function airFromModel() {
    var L = settings.loc;
    var url = 'https://air-quality-api.open-meteo.com/v1/air-quality?latitude=' + L.lat +
      '&longitude=' + L.lon + '&current=pm2_5&timezone=Asia%2FBangkok';
    getJSON(url, function (j) {
      var c = j.current || {};
      if (typeof c.pm2_5 === 'number') { showPM(c.pm2_5, T('model')); }
    }, function () { /* keep last reading */ });
  }

  // Air4Thai station data, refreshed hourly by GitHub Actions into air.json.
  function parseLocal(t) {
    var m = /^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})/.exec(t || '');
    if (!m) { return null; }
    return new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]);
  }

  function updateAir() {
    getJSON('air.json?t=' + new Date().getTime(), function (j) {
      var L = settings.loc, list = j.stations || [], best = null, bestD = 1e9;
      var cosLat = Math.cos(L.lat * Math.PI / 180);
      for (var i = 0; i < list.length; i++) {
        var dx = (list[i].lon - L.lon) * cosLat, dy = list[i].lat - L.lat;
        var dd = Math.sqrt(dx * dx + dy * dy) * 111; // km
        if (dd < bestD) { bestD = dd; best = list[i]; }
      }
      var when = best ? parseLocal(best.t) : null;
      var ageH = when ? (new Date().getTime() - when.getTime()) / 3600000 : 99;
      if (!best || bestD > 30 || ageH > 3) { airFromModel(); return; }
      var name = (settings.lang === 'en' ? best.ne : best.n) || best.n || '';
      if (name.length > 22) { name = name.substr(0, 21) + '…'; }
      showPM(best.pm, pad(when.getHours()) + ':00 · ' + name);
    }, airFromModel);
  }

  // ---------- Photos ----------
  var sharedPhotos = [];
  var localPhotos = load('photos', []);
  var photoIdx = 0, photoTimer = null;

  function allPhotos() { return sharedPhotos.concat(localPhotos); }

  function showNextPhoto() {
    var list = allPhotos(), bg = $('bg');
    clearTimeout(photoTimer);
    if (settings.photo !== 'on' || list.length === 0) { bg.className = ''; return; }
    photoIdx = photoIdx % list.length;
    var src = list[photoIdx];
    photoIdx++;
    var img = new Image();
    img.onload = function () {
      bg.className = '';
      setTimeout(function () {
        bg.style.backgroundImage = 'url("' + src + '")';
        bg.className = 'on';
      }, 700);
    };
    img.src = src;
    photoTimer = setTimeout(showNextPhoto, PHOTO_EVERY_MS);
  }

  function updatePhotoCount() {
    var u = T('photosUnit') ? ' ' + T('photosUnit') : '';
    $('photoCount').textContent = T('photosLocal') + ' ' + localPhotos.length + u + ' · ' +
      T('photosServer') + ' ' + sharedPhotos.length + u;
  }

  function loadSharedPhotos() {
    getJSON('photos/photos.json?t=' + new Date().getTime(), function (j) {
      sharedPhotos = [];
      for (var i = 0; i < j.length; i++) { sharedPhotos.push('photos/' + j[i]); }
      updatePhotoCount(); showNextPhoto();
    }, function () { updatePhotoCount(); showNextPhoto(); });
  }

  function shrink(file, done) {
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var w = img.width, h = img.height, s = Math.min(1, PHOTO_MAX_EDGE / Math.max(w, h));
        var cv = document.createElement('canvas');
        cv.width = Math.round(w * s); cv.height = Math.round(h * s);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        done(cv.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = function () { done(null); };
      img.src = reader.result;
    };
    reader.onerror = function () { done(null); };
    reader.readAsDataURL(file);
  }

  $('file').onchange = function (e) {
    var files = e.target.files, i = 0, added = 0, full = false;
    function next() {
      if (i >= files.length) {
        $('file').value = '';
        updatePhotoCount();
        if (full) { $('photoCount').textContent = T('full') + ' ' + added; }
        photoIdx = Math.max(0, allPhotos().length - Math.max(added, 1));
        showNextPhoto();
        return;
      }
      shrink(files[i++], function (data) {
        if (data && localPhotos.length < MAX_LOCAL_PHOTOS) {
          localPhotos.push(data);
          if (save('photos', localPhotos)) { added++; } else { localPhotos.pop(); full = true; }
        } else if (data) { full = true; }
        next();
      });
    }
    next();
  };

  $('clearPhotos').onclick = function () {
    localPhotos = []; save('photos', localPhotos); updatePhotoCount(); showNextPhoto();
  };

  // ---------- Settings panel ----------
  function bindSeg(id, key, after) {
    var btns = $(id).getElementsByTagName('button');
    function paint() {
      for (var i = 0; i < btns.length; i++) {
        btns[i].className = btns[i].getAttribute('data-v') === settings[key] ? 'active' : '';
      }
    }
    for (var i = 0; i < btns.length; i++) {
      btns[i].onclick = function () {
        settings[key] = this.getAttribute('data-v'); save(key, settings[key]); paint();
        if (after) { after(); }
      };
    }
    paint();
  }
  bindSeg('segPhoto', 'photo', showNextPhoto);
  bindSeg('segSec', 'sec', null);
  bindSeg('segNight', 'night', function () { lastMinute = -1; });
  bindSeg('segLang', 'lang', function () {
    applyLang(); paintLoc(); updatePhotoCount(); lastMinute = -1; updateWeather();
  });

  function paintLoc() {
    var L = settings.loc;
    $('locName').textContent = L.lat === DEFAULT_LOC.lat && L.lon === DEFAULT_LOC.lon ? T('bkk') : T('here');
  }
  $('useBkk').onclick = function () {
    settings.loc = DEFAULT_LOC; save('loc', settings.loc); paintLoc(); updateWeather();
  };
  $('useGps').onclick = function () {
    if (!navigator.geolocation) { return; }
    $('locName').textContent = T('finding');
    navigator.geolocation.getCurrentPosition(function (p) {
      settings.loc = {
        lat: Math.round(p.coords.latitude * 1000) / 1000,
        lon: Math.round(p.coords.longitude * 1000) / 1000,
        name: 'ตำแหน่งปัจจุบัน'
      };
      save('loc', settings.loc); paintLoc(); updateWeather();
    }, function () { paintLoc(); }, { timeout: 15000 });
  };

  function openPanel() { $('panel').className = 'open'; }
  function closePanel() { $('panel').className = ''; }
  $('gear').onclick = openPanel;
  $('closePanel').onclick = closePanel;
  $('stage').onclick = function () { if ($('panel').className === 'open') { closePanel(); } };

  // ---------- Pixel shift (anti image-retention) ----------
  function drift() {
    var w = window.innerWidth, h = window.innerHeight;
    var dx = Math.round((Math.random() * 2 - 1) * w * 0.03);
    var dy = Math.round((Math.random() * 2 - 1) * h * 0.05);
    var t = 'translate(' + dx + 'px,' + dy + 'px)';
    var s = $('stage').style;
    s.webkitTransform = t; s.transform = t;
    setTimeout(drift, DRIFT_EVERY_MS);
  }

  // ---------- Start ----------
  applyLang();
  paintLoc();
  tick();
  updateWeather();
  loadSharedPhotos();
  setTimeout(drift, DRIFT_EVERY_MS);

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) { lastMinute = -1; updateWeather(); }
  });
})();
</script>
</body>
</html>
